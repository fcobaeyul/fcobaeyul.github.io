<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>최소·최대배율 계산기</title>
<style>
:root{
  color-scheme:dark;
  font-family:Arial,"Malgun Gothic",sans-serif;
  background:#10151d;
  color:#edf3fa
}
*{box-sizing:border-box}
body{margin:0;padding:100px 24px 16px}
.container{max-width:680px;margin:auto}
h1{margin:0 0 24px;text-align:center;font-size:25px;color:#eaf7ff}
.rate-overview{
  position:fixed;z-index:10;top:14px;
  right:max(12px,calc((100vw - 680px)/2));
  padding:6px 9px;border:1px solid #465466;border-radius:7px;
  background:#1b2532;color:#bceaff;font-size:12px;font-weight:700;
  text-decoration:none
}
.rate-overview:hover{border-color:#8bd9f5;background:#20394a}
.section{margin-bottom:22px}
.section-title{margin-bottom:10px;font-size:15px;font-weight:700;color:#c7d4e2}
#priceSectionTitle{margin-top:10px}
#priceStageNumber{margin-right:4px;font-size:1.25em;font-weight:900;color:#fff}
.price-stage-unit{margin-right:2px}
.stage-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
button{font-weight:700;cursor:pointer;transition:.15s}
.stage-button{
  display:flex;align-items:center;justify-content:center;height:40px;padding:0;
  border:1px solid #46515f;border-radius:7px;color:#fff;
  font-size:17px;font-weight:800;line-height:1
}
.stage-button.stage-1,.stage-icon.stage-1{background:#4b4f56;color:#fff;border-radius:7px}
.stage-button.selected{outline:2px solid #73cafa;outline-offset:2px;transform:translateY(-1px)}
.stage-2,.stage-3,.stage-4{background:linear-gradient(135deg,#b9784b,#75452c)}
.stage-5,.stage-6,.stage-7{background:linear-gradient(135deg,#d4dce5,#747f8c);color:#17202a}
.stage-8,.stage-9,.stage-10{background:linear-gradient(135deg,#f8df83,#a77b20);color:#30230b}
.stage-11,.stage-12,.stage-13{background:linear-gradient(135deg,#f4fbff,#c7d7ff,#e8bdf2,#9be7e5,#f8e6a8);color:#202638}
.price-entry-row{display:flex;align-items:center;gap:8px}
input[type=text]{
  width:100%;height:52px;padding:0 14px;border:1px solid #465466;
  border-radius:9px;outline:0;background:#1b2532;color:#fff;font-size:17px
}
.price-entry-row input{flex:1;min-width:0;width:auto}
input[type=text]:focus{border-color:#56bce9;box-shadow:0 0 0 2px #56bce926}
.preview{
  display:flex;align-items:center;height:26px;margin-top:10px;color:#75d0f5;
  font-size:14px;font-weight:600;line-height:1;white-space:nowrap
}
.calculate-button,.reset-button{
  display:flex;align-items:center;justify-content:center;height:52px;
  border-radius:9px;font-size:14px;font-weight:800
}
.calculate-button{
  flex:0 0 112px;border:0;
  background:linear-gradient(135deg,#9be5ff,#45addd);color:#102331
}
.calculate-button:hover{filter:brightness(1.08)}
.reset-button{
  flex:0 0 72px;padding:5px;border:1px solid #8c79c7;
  background:#302b4a;color:#e0d8ff
}
.reset-button:hover{background:#453c68;border-color:#b6a5ff}
.message{
  display:none;margin-top:16px;padding:13px;border-radius:8px;
  background:#39252a;color:#ffb5bd;text-align:center;font-size:14px
}
.message.show,.result-area.show{display:block}
.result-area{display:none;margin-top:20px}
.shared-setting-row{display:flex;justify-content:flex-end;min-height:18px;margin:0 2px 6px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;gap:24px}
.result-card{
  min-width:0;padding:13px;border:1px solid #344252;border-top:3px solid #56bce9;
  border-radius:11px;background:#192330
}
.result-card.max{border-top-color:#8bd9f5}
.card-title{
  display:flex;align-items:baseline;gap:6px;margin-bottom:6px;
  color:#a9dff6;font-size:14px;font-weight:700;line-height:1.4
}
.max .card-title{color:#8bd9f5}
.heading-label,.rate-text{white-space:nowrap}
.rate-text{margin-left:1px;color:#d9eaf3;font-weight:500}
.rate-number{display:inline-block;width:3em;text-align:right;font-variant-numeric:tabular-nums}
.narrow-setting{
  display:inline-flex;align-items:center;gap:4px;color:#bceaff;
  font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap
}
.narrow-setting input{width:14px;height:14px;margin:0;accent-color:#56bce9;cursor:pointer}
.reference-price{
  display:flex;align-items:center;gap:6px;min-width:0;margin:26px 0 0;line-height:1.3
}
.price-label{
  display:inline-flex;flex:0 0 auto;align-items:center;gap:4px;
  color:#aab8c8;font-size:12px;font-weight:600;white-space:nowrap
}
.stage-icon{
  display:inline-flex;flex:0 0 25px;align-items:center;justify-content:center;
  width:25px;height:25px;border:1px solid #46515f;border-radius:6px;
  font-size:13px;font-weight:800
}
.stage-icon:is(.stage-1,.stage-2,.stage-3,.stage-4){color:#fff}
.stage-icon:is(.stage-5,.stage-6,.stage-7,.stage-8,.stage-9,.stage-10,.stage-11,.stage-12,.stage-13){color:#111}
.price-stage-icon{
  flex-basis:42px;width:42px;height:36px;border-radius:7px;
  font-size:17px;transform:translateY(-3px)
}
.price-value{
  flex:1 1 auto;min-width:0;margin-left:auto;color:#fff;
  font-size:clamp(12px,2.9vw,20px);font-weight:800;text-align:right;white-space:nowrap
}
.market-note{
  display:block;min-height:14px;margin-top:5px;font-size:11px;font-weight:700;
  line-height:1.5;text-align:center;visibility:hidden
}
.market-note.show{visibility:visible}
.binding-note{color:#ff6b75}
.popular-note{color:#ffb86b}
.trade-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.trade-button{
  min-width:0;min-height:52px;padding:7px 5px;border:1px solid #438eb2;
  border-radius:7px;background:#20394a;color:#e0f6ff;
  font-size:14px;font-weight:800;line-height:1.25
}
.trade-button:hover,.trade-button.active{background:#286080;border-color:#8bd9f5}
.trade-button.lower-button{border-color:#438eb2;background:#20394a;color:#d5f1ff}
.trade-button.lower-button:hover,.trade-button.lower-button.active{background:#286080;border-color:#8bd9f5}
.trade-button.upper-button{border-color:#a84c58;background:#492b31;color:#ffd4d8}
.trade-button.upper-button:hover,.trade-button.upper-button.active{background:#713640;border-color:#ff8792;color:#fff1f2}
@media(max-width:480px){
  body{padding:52px 12px 16px}
  h1{font-size:22px}
  .rate-overview{top:10px;right:12px;padding:5px 8px;font-size:11px}
  .stage-grid{gap:4px}
  .stage-button{height:35px;font-size:15px}
  .price-entry-row{gap:5px}
  .calculate-button{flex-basis:88px;font-size:13px}
  .reset-button{flex-basis:64px;font-size:13px}
  #priceSectionTitle{margin-top:8px}
  .result-grid{grid-template-columns:1fr;gap:14px}
  .result-card{padding:13px 10px}
  .card-title{font-size:13px}
  .price-label{gap:4px;font-size:11px}
  .price-stage-icon{flex-basis:36px;width:36px;height:33px;font-size:15px}
  .narrow-setting{font-size:10px}
  .trade-button{font-size:14px}
  .market-note{min-height:20px;font-size:10px}
}
</style>
</head>
<body>
<main class="container">
  <a class="rate-overview"
     href="https://www.fmkorea.com/10542238847"
     target="_blank"
     rel="noopener noreferrer">배율 전체보기</a>

  <h1>최소·최대배율 계산기</h1>

  <section class="section" aria-labelledby="stageHeading">
    <div class="section-title" id="stageHeading">강화 단계</div>
    <div class="stage-grid" id="stageGrid"></div>
  </section>

  <section class="section" aria-labelledby="priceSectionTitle">
    <div class="section-title" id="priceSectionTitle">
      <span id="priceStageNumber">1</span><span class="price-stage-unit">강 기준가 입력</span>
    </div>
    <div class="price-entry-row">
      <input id="priceInput" type="text" inputmode="numeric"
        placeholder="BP 금액 입력" autocomplete="off" aria-label="기준가 금액">
      <button class="calculate-button" id="calculateButton" type="button">계산하기</button>
      <button class="reset-button" id="resetButton" type="button">초기화</button>
    </div>
    <div class="preview" id="pricePreview" aria-live="polite"></div>
  </section>

  <div class="message" id="message" role="alert">올바른 값을 입력해 주세요.</div>

  <section class="result-area" id="resultArea" aria-label="계산 결과">
    <div class="shared-setting-row">
      <label class="narrow-setting" for="narrowMode">
        <input type="checkbox" id="narrowMode">
        <span>생제/공제</span>
      </label>
    </div>

    <div class="result-grid">
      <article class="result-card">
        <div class="card-title">
          <span class="heading-label">최소배율</span>
          <span class="rate-text"><span class="rate-number" id="minRateValue">1</span>배</span>
        </div>
        <div class="reference-price">
          <span class="price-label">
            <span class="stage-icon price-stage-icon" id="minPriceStageIcon"></span>
            <span id="minPriceLabel">강 기준가</span>
          </span>
          <span class="price-value" id="minPriceValue"></span>
        </div>
        <div class="market-note binding-note" id="bindingNote">귀속매물의 경우 하한가 배율이 낮을 수 있습니다.</div>
        <div class="trade-buttons">
          <button class="trade-button lower-button" id="minLowerButton" type="button">하한가</button>
          <button class="trade-button upper-button" id="minUpperButton" type="button">상한가</button>
        </div>
      </article>

      <article class="result-card max">
        <div class="card-title">
          <span class="heading-label">최대배율</span>
          <span class="rate-text"><span class="rate-number" id="maxRateValue">4</span>배</span>
        </div>
        <div class="reference-price">
          <span class="price-label">
            <span class="stage-icon price-stage-icon" id="maxPriceStageIcon"></span>
            <span id="maxPriceLabel">강 기준가</span>
          </span>
          <span class="price-value" id="maxPriceValue"></span>
        </div>
        <div class="market-note popular-note" id="popularNote">인기매물의 경우 최대배율이 높을 수 있습니다.</div>
        <div class="trade-buttons">
          <button class="trade-button lower-button" id="maxLowerButton" type="button">하한가</button>
          <button class="trade-button upper-button" id="maxUpperButton" type="button">상한가</button>
        </div>
      </article>
    </div>
  </section>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);
const ids=`
  stageGrid priceInput pricePreview calculateButton resetButton message resultArea priceStageNumber
  minRateValue maxRateValue minPriceStageIcon maxPriceStageIcon
  minPriceLabel minPriceValue maxPriceLabel maxPriceValue
  minUpperButton minLowerButton maxUpperButton maxLowerButton narrowMode
  bindingNote popularNote
`;
const dom=Object.fromEntries(ids.trim().split(/\s+/).map(id=>[id,$(id)]));

const MIN_PRICE=1000n;
const MAX_INPUT_PRICE=10n**19n;
const MAX_INPUT_DIGITS=1000;
const TYPES=["min","max"];

function makeRate(text) {
  const [whole,fraction=""]=text.split(".");
  return {
    label:text,
    numerator:BigInt(whole+fraction),
    denominator:10n**BigInt(fraction.length)
  };
}

const multipliers=Object.fromEntries(
  Object.entries({
    2:["1","4"],3:["1","5"],4:["1","6"],5:["1.5","8"],
    6:["2","20"],7:["2.15","25"],8:["1.7","40"],9:["1.2","30"],
    10:["1.45","35"],11:["1.55","35"],12:["1.55","35"],13:["3.21","35"]
  }).map(([stage,rates])=>[stage,rates.map(makeRate)])
);

const tradeRates={
  upper:[makeRate("1.1"),makeRate("1.01")],
  lower:[makeRate("0.9"),makeRate("0.99")]
};

const state={stage:1,result:null,minTrade:null,maxTrade:null};
const stageButtons=[];

function roundRatio(numerator,denominator,unit=1n) {
  const scaledDenominator=denominator*unit;
  const quotient=numerator/scaledDenominator;
  const remainder=numerator%scaledDenominator;
  return (quotient+(2n*remainder>=scaledDenominator?1n:0n))*unit;
}

function round3(value) {
  const unit=10n**BigInt(Math.max(0,value.toString().length-3));
  return roundRatio(value,1n,unit);
}

function multiply3(value,rate) {
  const numerator=value*rate.numerator;
  const integerPart=numerator/rate.denominator;
  const unit=10n**BigInt(Math.max(0,integerPart.toString().length-3));
  return roundRatio(numerator,rate.denominator,unit);
}

function priceUnit(value) {
  return 10n**BigInt(Math.max(0,value.toString().length-3));
}

function formatPrice(value) {
  value=BigInt(value);
  if(value<1000000n)return `${value.toLocaleString("ko-KR")} BP`;

  const units=["","만","억","조","경","해","자","양","구","간","정","재","극"];
  const parts=[];
  let index=0;

  while(value>0n) {
    const chunk=Number(value%10000n);
    if(chunk)parts.unshift(`${chunk.toLocaleString("ko-KR")}${units[index]??`×10^${index*4}`}`);
    value/=10000n;
    index++;
  }
  return `${parts.join(" ")} BP`;
}

function formatInputPrice(value) {
  return BigInt(value).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
}

function parsePrice(raw) {
  const text=raw.trim();
  if(!/^(?:0|[1-9]\d*|[1-9]\d{0,2}(?:,\d{3})+)$/.test(text))return null;
  const digits=text.replace(/,/g,"");
  if(digits.length>MAX_INPUT_DIGITS)return null;
  try{return BigInt(digits);}catch{return null;}
}

function calculateTradePrice(reference,rate) {
  const rounded=roundRatio(
    reference*rate.numerator,
    rate.denominator,
    priceUnit(reference)
  );
  return rounded<MIN_PRICE?MIN_PRICE:rounded;
}

function renderPrice(type,label,value) {
  const stage=state.result.stage;
  const icon=dom[`${type}PriceStageIcon`];
  icon.textContent=stage;
  icon.className=`stage-icon price-stage-icon stage-${stage}`;
  dom[`${type}PriceLabel`].textContent=`강 ${label}`;
  dom[`${type}PriceValue`].textContent=formatPrice(value);
}

function setStage(stage) {
  state.stage=stage;
  for(const button of stageButtons) {
    const selected=Number(button.dataset.stage)===stage;
    button.classList.toggle("selected",selected);
    button.setAttribute("aria-pressed",String(selected));
  }
  dom.priceStageNumber.textContent=stage;
}

function clearResult() {
  state.result=null;
  state.minTrade=state.maxTrade=null;
  dom.resultArea.classList.remove("show");
  dom.message.classList.remove("show");
  dom.narrowMode.checked=false;
  dom.bindingNote.classList.remove("show");
  dom.popularNote.classList.remove("show");

  for(const type of TYPES) {
    for(const direction of ["upper","lower"]) {
      const button=dom[`${type}${direction==="upper"?"Upper":"Lower"}Button`];
      button.classList.remove("active");
      button.textContent=direction==="upper"?"상한가":"하한가";
    }
  }
}

function showError(text="올바른 값을 입력해 주세요.") {
  dom.message.textContent=text;
  dom.message.classList.add("show");
  dom.resultArea.classList.remove("show");
}

function render() {
  if(!state.result)return;

  const {min,max,stage}=state.result;
  const [minRate,maxRate]=multipliers[stage];
  dom.minRateValue.textContent=minRate.label;
  dom.maxRateValue.textContent=maxRate.label;

  const rateIndex=dom.narrowMode.checked?1:0;
  const referencePrices={min,max};

  for(const type of TYPES) {
    const direction=state[`${type}Trade`];
    const reference=referencePrices[type];
    const value=direction
      ?calculateTradePrice(reference,tradeRates[direction][rateIndex])
      :reference;
    const label=direction==="upper"?"상한가":
      direction==="lower"?"하한가":"기준가";

    renderPrice(type,label,value);

    for(const tradeDirection of ["upper","lower"]) {
      const button=dom[`${type}${tradeDirection==="upper"?"Upper":"Lower"}Button`];
      const active=direction===tradeDirection;
      button.textContent=active?"원래대로":tradeDirection==="upper"?"상한가":"하한가";
      button.classList.toggle("active",active);
    }
  }

  const minValue=state.minTrade
    ?calculateTradePrice(min,tradeRates[state.minTrade][rateIndex])
    :min;
  dom.bindingNote.classList.toggle("show",state.minTrade==="lower"&&minValue>MIN_PRICE);
  dom.popularNote.classList.toggle("show",state.maxTrade==="upper");

  dom.message.classList.remove("show");
  dom.resultArea.classList.add("show");
}

function calculate() {
  clearResult();

  const raw=dom.priceInput.value.trim();
  if(raw==="") {
    dom.priceInput.value="0";
    dom.pricePreview.textContent=formatPrice(0n);
  }

  const input=parsePrice(raw===""?"0":raw);
  if(input===null||input>MAX_INPUT_PRICE||input%priceUnit(input)!==0n) {
    showError();
    return false;
  }

  const resultStage=state.stage+1;
  const rates=multipliers[resultStage];
  if(!rates) {
    showError();
    return false;
  }

  const base=round3(input);
  state.result={
    min:multiply3(base,rates[0]),
    max:multiply3(base,rates[1]),
    stage:resultStage
  };
  render();
  return true;
}

function toggleTrade(type,direction) {
  if(!state.result)return;
  const key=`${type}Trade`;
  state[key]=state[key]===direction?null:direction;
  render();
}

function resetAll() {
  clearResult();
  setStage(1);
  dom.priceInput.value="";
  dom.pricePreview.textContent="";
}

function formatInputWithCommas(input) {
  const caretPosition=input.selectionStart??input.value.length;
  const digitsBeforeCaret=input.value.slice(0,caretPosition).replace(/\D/g,"").length;
  const digits=input.value.replace(/\D/g,"").slice(0,MAX_INPUT_DIGITS);
  const formatted=digits.replace(/\B(?=(\d{3})+(?!\d))/g,",");
  input.value=formatted;

  let newCaret=0;
  let digitsCounted=0;
  while(newCaret<formatted.length&&digitsCounted<digitsBeforeCaret) {
    if(/\d/.test(formatted[newCaret]))digitsCounted++;
    newCaret++;
  }
  input.setSelectionRange(newCaret,newCaret);
}

function createStageButtons() {
  const fragment=document.createDocumentFragment();

  for(let stage=1;stage<=12;stage++) {
    const button=document.createElement("button");
    button.type="button";
    button.className=`stage-button stage-${stage}`;
    button.textContent=stage;
    button.dataset.stage=stage;
    button.setAttribute("aria-pressed",String(stage===state.stage));
    button.addEventListener("click",()=>{
      clearResult();
      setStage(stage);
    });
    stageButtons.push(button);
    fragment.append(button);
  }
  dom.stageGrid.append(fragment);
}

createStageButtons();
setStage(state.stage);

dom.priceInput.addEventListener("input",()=>{
  formatInputWithCommas(dom.priceInput);
  clearResult();
  const value=parsePrice(dom.priceInput.value);
  dom.pricePreview.textContent=
    value!==null&&value<=MAX_INPUT_PRICE?formatPrice(value):"";
});

dom.calculateButton.addEventListener("click",calculate);
dom.priceInput.addEventListener("keydown",event=>{
  if(event.key==="Enter")calculate();
});

for(const type of TYPES) {
  for(const direction of ["upper","lower"]) {
    dom[`${type}${direction==="upper"?"Upper":"Lower"}Button`]
      .addEventListener("click",()=>toggleTrade(type,direction));
  }
}

dom.narrowMode.addEventListener("change",()=>{
  if(state.result)render();
});
dom.resetButton.addEventListener("click",resetAll);
</script>
</body>
</html>
